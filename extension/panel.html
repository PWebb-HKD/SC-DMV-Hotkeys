<!doctype html>
<!-- panel extension view. Its same-named module owns behavior; static markup supplies stable IDs for that controller. --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SC DMV Hotkeys</title><link rel="stylesheet" href="style.css"></head><body class="panel"><header><img src="icons/icon48.png" alt=""><div><h1>SC DMV Hotkeys</h1><p>Search tools</p></div></header><main><form id="form"><div class="banner" id="banner">SCDMV ONLINE</div><h2 id="title">Loading…</h2><p id="message" hidden></p><div id="recordAlert" hidden role="status" aria-live="polite"></div><small id="alertCountdown" hidden></small><div id="inputArea" hidden><label id="valueLabel" for="value">Number</label><input id="value" type="text" autocomplete="off" spellcheck="false"><small id="countdown">Closes after 90 seconds.</small></div><div id="credentialsArea" hidden><p class="vault-note">The extension uses only the login you enter or save here. Credentials stay in this browser session unless you choose encrypted storage.</p><div id="unlockArea" hidden><label for="unlockPass">Vault passphrase</label><input id="unlockPass" type="password" autocomplete="off"><button type="button" class="secondary" id="useNew">Use a different login</button></div><div id="newCredentials"><label for="user">User ID</label><input id="user" type="text" autocomplete="username"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><label class="check"><input id="save" type="checkbox">Save in encrypted extension vault</label><div id="savePassArea" hidden><label for="savePass">Create vault passphrase (12+ characters)</label><input id="savePass" type="password" autocomplete="new-password"><small>Unlock once each browser session. The passphrase is never saved.</small></div></div></div><p id="error" class="error" role="alert"></p><div class="actions"><button id="cancel" type="button" class="secondary">Cancel</button><button id="submit" type="submit">Search</button></div></form></main><script type="module" src="panel.js"></script></body></html>
